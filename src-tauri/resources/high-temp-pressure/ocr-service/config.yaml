capture:
  source: camera
  device: "0"
  width: 1280
  height: 960
  fps: 30
  pixel_format: MJPG
  reconnect_backoff_seconds: [1, 2, 5, 10, 30]

screen:
  canonical_width: 1280
  canonical_height: 960
  content_rect: { x: 0, y: 0, width: 1280, height: 960 }
  aspect_ratio_tolerance: 0.01
  anchor:
    enabled: true
    template_path: reference-1280x960.png
    template_rect: { x: 396, y: 91, width: 558, height: 61 }
    search_margin: 24
    minimum_score: 0.88

sampling:
  interval_seconds: 2.5
  burst_milliseconds: 800
  maximum_frames: 30
  stable_streak: 6
  pixel_delta: 12
  changed_pixel_ratio: 0.02
  maximum_frame_age_seconds: 2.0
  realtime_interval_seconds: 0.5
  realtime_window_milliseconds: 200
  realtime_maximum_frames: 8
  realtime_stable_streak: 6
  realtime_history_points: 360
  realtime_regions:
    - vessel_250_upper_water_temp
    - vessel_250_lower_water_temp
    - vessel_480_upper_water_temp
    - vessel_480_lower_water_temp
    - cylinder_pressure

ocr:
  model_name: PP-OCRv6_small_rec
  model_dir: models/PP-OCRv6_small_rec
  require_local_model: true
  engine: onnxruntime
  device: cpu
  batch_size: 64
  target_height: 64
  padding: 4
  default_confidence_threshold: 0.85

storage:
  database_path: data/ocr.sqlite3
  incidents_dir: data/incidents
  retention_hours: 72
  incident_minimum_interval_seconds: 60
  incident_maximum_bytes: 5368709120

api:
  host: 127.0.0.1
  port: 8001

logging:
  level: INFO
  json: true

regions:
  - { id: oil_tank_level, label: "油箱油位", rect: { x: 81, y: 212, width: 36, height: 23 }, value_type: integer, decimal_places: 0 }
  - { id: oil_tank_oil_temp, label: "油箱油温", rect: { x: 277, y: 212, width: 37, height: 23 }, value_type: integer, decimal_places: 0, minimum: 0, maximum: 300, maximum_change_per_second: 10 }
  - { id: top_outlet_oil_temp, label: "出口油温", rect: { x: 353, y: 211, width: 39, height: 24 }, value_type: integer, decimal_places: 0, minimum: 0, maximum: 300, maximum_change_per_second: 10 }
  - { id: vessel_250_upper_water_temp, label: "250容器上部水温", rect: { x: 810, y: 254, width: 47, height: 22 }, value_type: integer, decimal_places: 0, minimum: 0, maximum: 300, maximum_change_per_second: 10 }
  - { id: air_source_pressure, label: "气源压力", rect: { x: 989, y: 267, width: 44, height: 21 }, value_type: decimal, decimal_places: 2 }
  - { id: vessel_250_upper_inlet_oil_temp, label: "250容器上进口油温", rect: { x: 735, y: 301, width: 45, height: 22 }, value_type: integer, decimal_places: 0, minimum: 0, maximum: 300, maximum_change_per_second: 10 }
