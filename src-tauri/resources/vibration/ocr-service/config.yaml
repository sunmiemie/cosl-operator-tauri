capture:
  source: dshow
  device: "AFN_cap video"
  width: 1280
  height: 1024
  fps: 30
  pixel_format: YUY2
  reconnect_backoff_seconds: [1, 2, 5, 10, 30]

screen:
  canonical_width: 1280
  canonical_height: 1024
  content_rect: { x: 0, y: 0, width: 1280, height: 1024 }
  aspect_ratio_tolerance: 0.01
  anchor:
    enabled: true
    # VT-TASK-20260909-610 实测标定：使用静态工具栏，避开标题和运行状态。
    template_path: data/test2-hardware/reference-20260909-1280x1024.png
    template_rect: { x: 20, y: 55, width: 380, height: 54 }
    search_margin: 12
    minimum_score: 0.96

sampling:
  interval_seconds: 2.5
  burst_milliseconds: 500
  maximum_frames: 12
  stable_streak: 3
  pixel_delta: 12
  changed_pixel_ratio: 0.02
  maximum_frame_age_seconds: 1.0
  stability_grace_milliseconds: 900
  stability_grace_maximum_frames: 12
  realtime_interval_seconds: 0.5
  realtime_window_milliseconds: 300
  realtime_maximum_frames: 8
  realtime_stable_streak: 3
  realtime_regions: [target, level, response, drive, elapsed, remaining, right_level]
  realtime_history_points: 240

ocr:
  model_name: PP-OCRv6_small_rec
  model_dir: models/PP-OCRv6_small_rec
  require_local_model: true
  engine: onnxruntime
  device: cpu
  batch_size: 64
  target_height: 64
  padding: 4
  default_confidence_threshold: 0.9995

storage:
  database_path: data/test2-hardware/ocr.sqlite3
  incidents_dir: data/test2-hardware/incidents
  retention_hours: 72
  incident_minimum_interval_seconds: 60
  incident_maximum_bytes: 536870912

api:
  host: 127.0.0.1
  port: 8002

logging:
  level: INFO
  json: true

regions:
  - { id: target, label: "目标", rect: { x: 22, y: 154, width: 80, height: 24 }, value_type: decimal, decimal_places: 4, variable_decimal_places: true }
  - { id: level, label: "量级", rect: { x: 112, y: 154, width: 80, height: 24 }, value_type: decimal, decimal_places: 2, variable_decimal_places: true, allow_negative: true }
  - { id: response, label: "响应", rect: { x: 202, y: 154, width: 80, height: 24 }, value_type: decimal, decimal_places: 4, variable_decimal_places: true }
  - { id: drive, label: "驱动", rect: { x: 312, y: 158, width: 60, height: 18 }, value_type: decimal, decimal_places: 1, variable_decimal_places: true }
  - { id: elapsed, label: "试验历经时间", rect: { x: 382, y: 154, width: 87, height: 26 }, value_type: time, decimal_places: 0 }
  - { id: remaining, label: "剩余时间", rect: { x: 481, y: 154, width: 87, height: 26 }, value_type: time, decimal_places: 0 }
  - { id: right_level, label: "右侧量级", rect: { x: 1190, y: 240, width: 78, height: 24 }, value_type: decimal, decimal_places: 2, variable_decimal_places: true, allow_negative: true }
