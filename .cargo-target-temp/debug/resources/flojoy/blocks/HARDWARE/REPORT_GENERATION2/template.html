<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<div class="relative flex min-h-screen flex-col justify-center overflow-hidden py-8 lg:py-12">
    <img src="https://play.tailwindcss.com/img/beams.jpg" alt=""
         class="fixed left-1/2 top-48 max-w-none -translate-x-2/3 -translate-y-1/2"/>
    <div class="absolute inset-0 bg-[url(https://play.tailwindcss.com/img/grid.svg)] bg-top [mask-image:linear-gradient(180deg,white,rgba(255,255,255,0))]"></div>
    <article
            class="relative w-full bg-white px-6 py-12 shadow-xl shadow-slate-700/10 ring-1 ring-gray-900/5 md:mx-auto md:max-w-3xl lg:max-w-4xl lg:pb-28 lg:pt-16">
        <div class="bg-white p-4">
            <div class="flex">
                <div class="flex flex-col">
                    <h1 class="text-3xl font-bold">{{TITLE}}</h1>
                    <div class="absolute right-10 top-5">
                        <img class="object-contain" style="max-width: 200px" src="{{LOGO_URL}}"/>
                    </div>
                    <div class="py-2"></div>
                    <div class="flex items-center gap-2">
                        <div>Status:</div>
                        <span class="inline-block"><h2 class="text-2xl font-bold">{{STATUS}}</h2></span>
                        <span class="inline-block">
                            <svg height="30" width="30">
                                <circle cx="15" cy="15" r="10" stroke="black" stroke-width="3" fill="{{STATUS_COLOR}}"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="grow"></div>
            </div>
            <div class="py-6"></div>
            <p>{{INTRODUCTION}}</p>
            {{FIGURES}}
        </div>
    </article>
</div>
<script>
</script>
</body>
</html>
